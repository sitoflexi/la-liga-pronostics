name: Resultados automáticos

on:
  schedule:
    - cron: "17 */2 * * *"  # cada 2 horas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar resultados y jornadas
        id: run
        run: |
          python scripts/update_results.py data.json | tee cambios.txt
      - name: Guardar cambios
        run: |
          if git diff --quiet data.json; then echo "Nada que guardar"; exit 0; fi
          git config user.name "liga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Bot: $(head -c 200 cambios.txt | tr '\n' ';' | sed 's/;$//')"
          git pull --rebase
          git push
